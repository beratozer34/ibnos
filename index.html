<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuğba Gürüz Simülasyonu</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a2e;
        color: #fff;
        text-align: center;
        padding: 20px;
        margin: 0;
    }
    #game-container {
        background-color: #16213e;
        padding: 30px;
        border-radius: 15px;
        max-width: 600px;
        margin: 40px auto;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    }
    h1 {
        color: #e94560;
        margin-bottom: 5px;
    }
    .stats {
        display: flex;
        justify-content: space-around;
        background-color: #0f3460;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-weight: bold;
    }
    .stat-value {
        color: #e94560;
    }
    #story-text {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 30px;
        min-height: 80px;
    }
    .btn {
        background-color: #e94560;
        color: white;
        border: none;
        padding: 15px 25px;
        margin: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }
    .btn:hover {
        background-color: #d1304b;
    }
</style>
</head>
<body>

<div id="game-container">
    <h1>Tuğba Gürüz</h1>
    <p>Hayat Simülasyonu</p>
    
    <div class="stats">
        <span>Enerji: <span id="enerji" class="stat-value">100</span></span>
        <span>Odak: <span id="odak" class="stat-value">100</span></span>
        <span>YKS Hedefi: <span class="stat-value">%</span><span id="yks" class="stat-value">0</span></span>
    </div>

    <div id="story-text">
        Sabah saat 08:00. Tuğba yatağında gözlerini açtı...<br><br>
        Bugün hayatının geri kalanını şekillendirecek o gün olabilir. Ne yapmalı?
    </div>

    <div id="choices">
        <button class="btn" onclick="secimYap('telefon')">Telefona Bak</button>
        <button class="btn" onclick="secimYap('yks')">YKS Çalışmaya Başla</button>
    </div>
</div>

<script>
    // Oyunun başlangıç değerleri
    let enerji = 100;
    let odak = 100;
    let yks_hedefi = 0;

    // Ekrandaki değerleri güncelleyen fonksiyon
    function durumlariGuncelle() {
        document.getElementById('enerji').innerText = enerji;
        document.getElementById('odak').innerText = odak;
        document.getElementById('yks').innerText = yks_hedefi;
    }

    // Seçim yapıldığında çalışacak ana fonksiyon
    function secimYap(secim) {
        let hikaye = document.getElementById('story-text');
        let butonlar = document.getElementById('choices');

        if(secim === 'telefon') {
            enerji -= 10;
            odak -= 40;
            hikaye.innerHTML = "Tuğba telefonu eline aldı... 2 saat su gibi akıp geçti. Reels izlerken zaman algısı yok oldu.<br><br><b>Sonuç:</b> Kötü bir başlangıç. Akşama kadar vicdan azabı çekilecek.";
            
            // Oyunu bitirip başa dönme butonu çıkartıyoruz
            butonlar.innerHTML = '<button class="btn" onclick="basaDon()">Başa Dön</button>';
        } 
        else if(secim === 'yks') {
            enerji -= 25;
            yks_hedefi += 20;
            hikaye.innerHTML = "Tuğba iradesini topladı, yorganı fırlattı ve masaya oturdu!<br><br>30 paragraf, 20 problem çözüldü. YKS maratonunda sağlam bir adım atıldı.<br><br><b>Sonuç:</b> Güne harika başlandı, motivasyon tavan!";
            
            // Oyunu bitirip başa dönme butonu çıkartıyoruz
            butonlar.innerHTML = '<button class="btn" onclick="basaDon()">Başa Dön</button>';
        }
        
        // Seçimden sonra barları güncelle
        durumlariGuncelle();
    }

    // Oyunu sıfırlayan fonksiyon
    function basaDon() {
        enerji = 100;
        odak = 100;
        yks_hedefi = 0;
        
        document.getElementById('story-text').innerHTML = "Sabah saat 08:00. Tuğba yatağında gözlerini açtı...<br><br>Bugün hayatının geri kalanını şekillendirecek o gün olabilir. Ne yapmalı?";
        document.getElementById('choices').innerHTML = '<button class="btn" onclick="secimYap(\'telefon\')">Telefona Bak</button> <button class="btn" onclick="secimYap(\'yks\')">YKS Çalışmaya Başla</button>';
        
        durumlariGuncelle();
    }
</script>

</body>
</html>
