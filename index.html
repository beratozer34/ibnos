<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tuğba Gürüz - Hayat Simülasyonu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background: #111; color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        
        /* OYUN ALANI */
        #game-area {
            position: relative; width: 100vw; height: 100vh; 
            background: #2c3e50;
            background-image: radial-gradient(#34495e 15%, transparent 16%);
            background-size: 40px 40px;
        }

        /* HUD (Sağ Üst Göstergeler) */
        #hud {
            position: absolute; top: 20px; right: 20px; 
            background: rgba(0,0,0,0.85); border: 2px solid #ffcc00;
            padding: 15px; border-radius: 10px; font-weight: bold; z-index: 50; 
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }
        .yks-text { color: #e74c3c; font-size: 1.2rem; }
        .time-text { color: #3498db; font-size: 1.4rem; }

        /* KARAKTER */
        #player {
            position: absolute; top: 40%; left: 45%;
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid #ffcc00; 
            background-image: url('tugba.jpeg'); 
            background-size: cover; background-position: center;
            z-index: 20; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .name-tag {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 5px 12px;
            font-size: 1rem; font-weight: bold; border-radius: 6px; white-space: nowrap;
            border: 1px solid #ffcc00;
        }

        /* ETKİLEŞİM NESNELERİ */
        .interact-obj {
            position: absolute; background: rgba(0,0,0,0.7); 
            border: 2px solid #fff; border-radius: 10px;
            padding: 15px 25px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; transition: 0.3s; z-index: 15;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .interact-obj:hover { background: #ffcc00; color: #000; border-color: #000; transform: scale(1.1); }
        
        #obj-phone { top: 60%; left: 30%; }
        #obj-door { top: 20%; left: 70%; background: #8e44ad; border-color: #9b59b6; }
        #obj-door:hover { background: #9b59b6; color: white; }

        /* POPUP MODALLAR (Telefon ve Olay Ekranları) */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }
        .hidden { display: none !important; }
        
        /* TELEFON EKRANI */
        .phone-ui {
            width: 320px; height: 600px; background: #000;
            border: 12px solid #333; border-radius: 40px;
            padding: 20px; display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        .phone-notch {
            width: 100px; height: 20px; background: #333;
            border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        }
        .phone-bg {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2400&auto=format&fit=crop') center/cover;
            flex: 1; border-radius: 20px; padding: 30px 15px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: start;
        }
        .app-btn {
            background: rgba(255,255,255,0.9); border: none; border-radius: 15px;
            height: 90px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 8px;
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .app-btn:active { transform: scale(0.95); }
        .app-btn img { width: 40px; height: 40px; border-radius: 8px; }
        .close-btn {
            margin-top: 15px; background: #e74c3c; color: white; border: none;
            padding: 15px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; cursor: pointer;
        }

        /* OLAY EKRANI (Abla & Minecraft) */
        .event-box {
            background: #222; border: 4px solid #e67e22; border-radius: 20px;
            padding: 30px; width: 90%; max-width: 500px; text-align: center;
        }
        .event-box h2 { color: #e67e22; margin-bottom: 15px; font-size: 2rem; }
        .event-box p { font-size: 1.2rem; line-height: 1.6; margin-bottom: 25px; }
        .action-btn {
            background: #27ae60; color: white; font-size: 1.3rem; font-weight: bold;
            padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 0 #2ecc71;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        /* AKŞAM SONUÇ EKRANI */
        #end-screen .event-box { border-color: #3498db; }
        #end-screen h2 { color: #3498db; font-size: 2.5rem; }
    </style>
</head>
<body>

    <div id="game-area">
        <!-- SAĞ ÜST BİLGİ PANELİ -->
        <div id="hud">
            <div class="time-text">SAAT: <span id="game-clock">08:00</span></div>
            <div class="yks-text">YKS'YE: <br><span id="yks-timer">Hesaplanıyor...</span></div>
        </div>

        <!-- TUĞBA -->
        <div id="player">
            <div class="name-tag">TUĞBA GÜRÜZ</div>
        </div>

        <!-- NESNELER -->
        <div class="interact-obj" id="obj-phone" onclick="openPhone()">
            <span style="font-size: 2rem;">📱</span>
            Telefona Bak
        </div>

        <div class="interact-obj" id="obj-door" onclick="tryGoOut()">
            <span style="font-size: 2rem;">🚪</span>
            Dışarı Çık
        </div>

        <!-- TELEFON ARAYÜZÜ MODALI -->
        <div id="phone-modal" class="modal-overlay hidden">
            <div class="phone-ui">
                <div class="phone-notch"></div>
                <div class="phone-bg">
                    <button class="app-btn" onclick="useApp('TikTok')">
                        <img src="https://img.icons8.com/color/48/000000/tiktok--v1.png">
                        TikTok
                    </button>
                    <button class="app-btn" onclick="useApp('Instagram')">
                        <img src="https://img.icons8.com/color/48/000000/instagram-new--v1.png">
                        Instagram
                    </button>
                    <button class="app-btn" onclick="useApp('YouTube')">
                        <img src="https://img.icons8.com/color/48/000000/youtube-play.png">
                        YouTube
                    </button>
                    <button class="app-btn" onclick="useApp('Snapchat')">
                        <img src="https://img.icons8.com/color/48/000000/snapchat-new.png">
                        Snapchat
                    </button>
                </div>
                <button class="close-btn" onclick="closePhone()">Ekranı Kapat</button>
            </div>
        </div>

        <!-- ABLA ETKİNLİĞİ MODALI -->
        <div id="event-modal" class="modal-overlay hidden">
            <div class="event-box">
                <h2>BASKIN!</h2>
                <p>Tam Alibeyköy sokaklarına akacaktın ki kapıda <b>ABLAM</b> belirdi!<br><br>
                   Ertuğrul, Murat ve Cihan'ı üstüne attı ve gitti. Dışarı çıkman iptal oldu. Mecburen çocukları susturmak için bilgisayarı açıyorsun...</p>
                <button class="action-btn" onclick="playMinecraft()">Minecraft'a Gir (3 Saat Gider)</button>
            </div>
        </div>

        <!-- GÜN SONU MODALI -->
        <div id="end-screen" class="modal-overlay hidden">
            <div class="event-box">
                <h2>AKŞAM OLDU!</h2>
                <p id="end-message"></p>
                <button class="action-btn" onclick="location.reload()">Yeni Güne Uyan</button>
            </div>
        </div>

    </div>

    <script>
        // Oyun Değişkenleri
        let saat = 8;
        let dakika = 0;
        const gameClock = document.getElementById('game-clock');
        const phoneModal = document.getElementById('phone-modal');
        const eventModal = document.getElementById('event-modal');
        const endScreen = document.getElementById('end-screen');
        
        let ablaGeldiMi = false;

        // YKS Sayacı Fonksiyonu (Ertan Sinan Şahin mantığı)
        function updateYKSTimer() {
            // YKS 2027 tahmini tarihi: 20 Haziran 2027 10:15
            const targetDate = new Date("June 20, 2027 10:15:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('yks-timer').innerHTML = `${days} Gün ${hours} Saat ${minutes} Dk`;
            } else {
                document.getElementById('yks-timer').innerHTML = "YKS GELDİ!";
            }
        }
        setInterval(updateYKSTimer, 1000);
        updateYKSTimer();

        // Saat Güncelleme Fonksiyonu
        function saatiIlet(kacSaatGecti) {
            saat += kacSaatGecti;
            if (saat >= 24) saat = saat - 24;
            
            // Saati ekrana yaz formatlama (08:00, 15:00 vb.)
            let gorunenSaat = saat < 10 ? "0" + saat : saat;
            gameClock.innerText = gorunenSaat + ":00";

            // Akşam 20:00 olduysa gün biter
            if (saat >= 20 || (saat >= 0 && saat < 8)) {
                gunuBitir();
            }
        }

        // Telefon İşlemleri
        function openPhone() {
            if (saat >= 20) return;
            phoneModal.classList.remove('hidden');
        }
        function closePhone() {
            phoneModal.classList.add('hidden');
        }
        function useApp(appName) {
            alert(`${appName} bataklığına düştün. Su gibi 2 saat aktı geçti!`);
            saatiIlet(2);
            closePhone();
        }

        // Dışarı Çıkma İşlemi
        function tryGoOut() {
            if (saat >= 20) return;
            
            if (!ablaGeldiMi) {
                // İlk defa çıkmaya çalışıyorsa abla baskını
                eventModal.classList.remove('hidden');
            } else {
                alert("Ablan çocukları bıraktığı için dışarı çıkamazsın! Çocuklar başının etini yiyor.");
            }
        }

        // Minecraft Oynama İşlemi
        function playMinecraft() {
            ablaGeldiMi = true; // Artık dışarı çıkamaz
            eventModal.classList.add('hidden');
            alert("Ertuğrul, Murat ve Cihan ile elmas ararken 3 saat heba oldu...");
            saatiIlet(3);
        }

        // Gün Sonu Fonksiyonu
        function gunuBitir() {
            phoneModal.classList.add('hidden');
            eventModal.classList.add('hidden');
            endScreen.classList.remove('hidden');
            
            let mesaj = document.getElementById('end-message');
            if (ablaGeldiMi) {
                mesaj.innerHTML = "Yeğenler, telefon ve boş işler derken gün bitti. YKS sayacındaki rakamlar sana acıyarak bakıyor. Yarın masaya oturabilecek misin?";
            } else {
                mesaj.innerHTML = "Telefonda o kadar çok vakit geçirdin ki akşama kadar boynun tutuldu. YKS hayalleri başka bahara kaldı galiba...";
            }
        }
    </script>
</body>
</html>
